name: nurivoyage
x-app: &app
  image: espocrm/espocrm:10.0.10@sha256:debf48652fed511424825839185fd67e773081ee0d665ab62cbce985acb32636
  restart: unless-stopped
  volumes:
    - espo-data:/var/www/html/data
    - ./custom:/var/www/html/custom
    - ./client/custom:/var/www/html/client/custom
    - ./scripts/nurivoyage:/opt/nurivoyage:ro
services:
  db:
    image: mariadb:11.4.5@sha256:49117dcc565cf51aa57ac5fca59ab31213402ff0eae6ffc13c46a37b938f7e4b
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?configure .env}
      MARIADB_USER: ${DB_USER:?configure .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?configure .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?configure .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  crm:
    <<: *app
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8080:80'
    env_file: .env
    environment:
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_NAME: ${DB_NAME}
      ESPOCRM_DATABASE_USER: ${DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPO_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPO_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${APP_URL}
      ESPOCRM_CONFIG_USE_WEB_SOCKET: 'true'
      ESPOCRM_CONFIG_WEB_SOCKET_URL: ${WS_URL:-ws://localhost:8081}
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: tcp://websocket:7777
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost/api/v1/Settings >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
  daemon:
    <<: *app
    entrypoint: docker-daemon.sh
    depends_on:
      crm: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1 && test -f data/config.php']
      interval: 10s
      timeout: 5s
      retries: 3
  websocket:
    <<: *app
    entrypoint: docker-websocket.sh
    environment:
      ESPOCRM_CONFIG_USE_WEB_SOCKET: 'true'
      ESPOCRM_CONFIG_WEB_SOCKET_URL: ${WS_URL:-ws://localhost:8081}
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: tcp://*:7777
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: tcp://websocket:7777
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8081:8080'
    depends_on:
      crm: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'php -r "exit(@fsockopen(\"127.0.0.1\",8080)?0:1);"']
      interval: 10s
      timeout: 5s
      retries: 6
  minio:
    image: nurivoyage/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: infrastructure/local/minio.Dockerfile
    command: server /data --console-address ':9001'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:9000:9000'
      - '${BIND_ADDRESS:-127.0.0.1}:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30
  minio-init:
    image: espocrm/espocrm:10.0.10@sha256:debf48652fed511424825839185fd67e773081ee0d665ab62cbce985acb32636
    depends_on:
      minio: {condition: service_healthy}
    env_file: .env
    volumes:
      - ./scripts/nurivoyage:/opt/nurivoyage:ro
    entrypoint: [php, /opt/nurivoyage/storage-init.php]

  mailpit:
    image: axllent/mailpit:v1.24.1@sha256:4873e5a441ed368f1e98a832f61257a033859f5e829542cd03fb772d2282ea4e
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8025:8025'
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 15
  maintenance:
    image: espocrm/espocrm:10.0.10@sha256:debf48652fed511424825839185fd67e773081ee0d665ab62cbce985acb32636
    profiles: [tools]
    entrypoint: []
    volumes:
      - espo-data:/snapshot/espo
      - minio-data:/snapshot/minio
      - mailpit-data:/snapshot/mailpit
volumes:
  db-data:
  espo-data:
  minio-data:
  mailpit-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.231.0.0/24}
